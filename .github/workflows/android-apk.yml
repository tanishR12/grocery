name: Build Android APK

on:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        run: |
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/android-commandline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p "$SDK_ROOT/cmdline-tools"
          unzip -q "$RUNNER_TEMP/android-commandline-tools.zip" -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK_ROOT" --licenses > /dev/null
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK_ROOT" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build and lint
        env:
          ORG_GRADLE_PROJECT_FIREBASE_APPLICATION_ID: ${{ vars.FIREBASE_APPLICATION_ID }}
        run: ./gradlew assembleDebug lintDebug

      - name: Prepare downloadable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/zyplo-partner.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zyplo-partner-apk
          path: dist/zyplo-partner.apk
          if-no-files-found: error
          retention-days: 30

name: Build Android APK

on:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build and lint
        env:
          ORG_GRADLE_PROJECT_FIREBASE_APPLICATION_ID: ${{ vars.FIREBASE_APPLICATION_ID }}
        run: ./gradlew assembleDebug lintDebug

      - name: Prepare downloadable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/zyplo-partner.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zyplo-partner-apk
          path: dist/zyplo-partner.apk
          if-no-files-found: error
          retention-days: 30
